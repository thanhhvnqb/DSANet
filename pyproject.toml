[project]
name = "dsanet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hoang Van Thanh", email = "thanhhv@qbu.edu.vn" }
]
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "ftfy>=6.3.1",
    "packaging>=26.3",
    "pandas>=2.3.3",
    "regex>=2026.1.15",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
    "tqdm>=4.70.1",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[project.scripts]
dsanet = "dsanet:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
